[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma4-autonomous-software-engineering-agent"
version = "0.1.0"
description = "Reproducible tooling for a Gemma 4 autonomous software engineering agent"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Sergio Luiz dos Santos" }]
keywords = ["gemma-4", "ai-agents", "software-engineering", "lora", "google-adk", "kaggle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pyyaml>=6.0.2,<7",
    "numpy>=2.1,<3",
    "networkx>=3.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]
training = [
    "torch>=2.5,<3",
    "transformers>=4.48,<6",
    "peft>=0.14,<1",
    "accelerate>=1.2,<2",
    "safetensors>=0.4.5,<1",
]

[project.urls]
Repository = "https://github.com/Santosdevbjj/gemma4-autonomous-software-engineering-agent"
Issues = "https://github.com/Santosdevbjj/gemma4-autonomous-software-engineering-agent/issues"

[project.scripts]
gemma4-agent = "gemma4_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]