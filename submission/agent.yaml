agent_class: LlmAgent
name: gemma4_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: Resolve a Python issue with bounded exploration and a minimal verified patch.
instruction: !include prompts/system.md
generate_content_config: !include configs/sampling.yaml
skills:
  - skills/repo_navigation
tools:
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
  - run_command
  - submit_patch
  - get_status
  - read_file
  - edit_file
  - write_file
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph